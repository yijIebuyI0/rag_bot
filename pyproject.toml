[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-bot"
version = "0.1.0"
description = "A Streamlit document Q&A bot with upload, retrieval and page-level citations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=1.5.0",
  "langchain-chroma>=1.0.0",
  "langchain-core>=1.0.0",
  "langchain-text-splitters>=1.0.0",
  "openai>=2.0.0",
  "pypdf>=6.0.0",
  "python-dotenv>=1.0.0",
  "streamlit>=1.50.0",
]

[project.scripts]
marketing-rag-build = "marketing_rag.cli:build_main"
marketing-rag-ask = "marketing_rag.cli:ask_main"

[tool.setuptools.packages.find]
where = ["src"]
